name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the IPA to
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Flackle-1.0.0-unsigned.ipa Payload

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.tag }}" >/dev/null 2>&1 || \
            gh release create "${{ inputs.tag }}" \
              --title "Flackle Mobile ${{ inputs.tag }}" \
              --notes "Unsigned iOS IPA and Android APK."

      - name: Upload IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" Flackle-1.0.0-unsigned.ipa --clobber
