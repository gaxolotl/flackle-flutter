name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the IPA to
        required: true
        default: v1.0.5

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Read and verify app version
        run: |
          version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          test "$RELEASE_TAG" = "v$version"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "Flackle-${APP_VERSION}-unsigned.ipa" Payload

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "Flackle Mobile ${APP_VERSION}" \
              --notes "Unsigned iOS IPA and Android APK."

      - name: Upload IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "Flackle-${APP_VERSION}-unsigned.ipa" --clobber
