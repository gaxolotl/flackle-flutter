name: flackle_mobile
description: An unofficial Flutter client for Flackle.
publish_to: none
version: 1.0.3+4
repository: https://github.com/gaxolotl/flackle-flutter
issue_tracker: https://github.com/gaxolotl/flackle-flutter/issues

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  characters: ^1.3.0
  collection: ^1.18.0
  file_picker: ^8.1.2
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.0.10+1
  http: ^1.2.2
  http_parser: ^4.0.2
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  web_socket_channel: ^3.0.1
  flutter_local_notifications: ^22.3.3
  flutter_foreground_task: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/icons/
    - assets/channel-icons/
    - assets/emoji/
    - assets/emoji_data.json
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope-variable.ttf
    - family: Satoshi
      fonts:
        - asset: assets/fonts/satoshi-variable.ttf
        - asset: assets/fonts/satoshi-italic.ttf
          style: italic

